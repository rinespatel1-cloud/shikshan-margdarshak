<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--saffron:#F97316;--saffron-d:#C2410C;--green:#16A34A;--blue:#1D4ED8;--dark:#0F172A;--mid:#475569;--light:#F8FAFC;--border:#E2E8F0;--radius:16px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans Gujarati',sans-serif;background:var(--light);color:var(--dark);min-height:100vh;}
header{background:linear-gradient(135deg,#0F172A 0%,#1E3A5F 50%,#0F3324 100%);padding:24px 16px 20px;text-align:center;position:relative;overflow:hidden;}
header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(249,115,22,.15) 0%,transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(22,163,74,.15) 0%,transparent 60%);}
.hc{position:relative;z-index:1;}
.hbadge{display:inline-flex;align-items:center;gap:5px;background:rgba(249,115,22,.2);border:1px solid rgba(249,115,22,.4);border-radius:50px;padding:3px 12px;font-size:11px;color:#FED7AA;font-weight:600;letter-spacing:.5px;margin-bottom:10px;}
header h1{font-size:23px;font-weight:700;color:#fff;line-height:1.3;}
header p{color:#94A3B8;font-size:13px;margin-top:5px;line-height:1.6;}
.sticky-search{position:sticky;top:0;z-index:100;background:var(--light);padding:14px 16px 10px;}
.si{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--border);border-radius:50px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.07);transition:border-color .2s;}
.si:focus-within{border-color:var(--saffron);}
.si input{flex:1;border:none;outline:none;font-size:14px;font-family:'Noto Sans Gujarati',sans-serif;background:transparent;color:var(--dark);}
.si input::placeholder{color:#94A3B8;}
.tabs{display:flex;gap:7px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{white-space:nowrap;padding:7px 14px;border-radius:50px;border:2px solid var(--border);background:#fff;font-family:'Noto Sans Gujarati',sans-serif;font-size:12px;font-weight:600;color:var(--mid);cursor:pointer;transition:all .2s;flex-shrink:0;}
.tab.active{background:var(--saffron);border-color:var(--saffron);color:#fff;}
.tab:hover:not(.active){border-color:var(--saffron);color:var(--saffron);}
.list{padding:0 16px 40px;display:flex;flex-direction:column;gap:10px;}
.card{background:#fff;border-radius:var(--radius);border:2px solid var(--border);overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.05);cursor:pointer;}
.card-hd{display:flex;align-items:center;gap:12px;padding:14px 16px;}
.cicon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.ctitle{flex:1;}
.ctitle h3{font-size:15px;font-weight:700;color:var(--dark);line-height:1.3;}
.ctitle p{font-size:11px;color:#94A3B8;margin-top:2px;}
.carr{font-size:16px;color:#CBD5E1;transition:transform .3s;}
.card.open .carr{transform:rotate(90deg);color:var(--saffron);}
.detail{display:none;background:#FAFAFA;border-top:2px solid var(--border);}
.card.open .detail{display:block;animation:sd .3s ease;}
@keyframes sd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.ds{padding:14px 16px;border-bottom:1px solid #F1F5F9;}
.ds:last-child{border-bottom:none;}
.dsh{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--mid);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px;}
.fb{background:#EFF6FF;border:2px solid #BFDBFE;border-radius:12px;padding:11px 13px;}
.fb .fn{font-size:15px;font-weight:700;color:var(--blue);}
.fb .ff{font-size:11px;color:#3B82F6;margin-top:2px;}
.fb .fw{font-size:11px;color:var(--mid);margin-top:5px;}
.dr{display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:1px dashed #F1F5F9;font-size:13px;color:var(--mid);}
.dr:last-child{border-bottom:none;}
.dn{width:18px;height:18px;border-radius:50%;background:var(--saffron);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.dc{display:inline-flex;align-items:center;gap:5px;background:#FEF2F2;border:1.5px solid #FECACA;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:#991B1B;margin:3px;}
.ep{display:inline-flex;align-items:center;gap:6px;background:#F0FDF4;border:2px solid #86EFAC;border-radius:10px;padding:7px 13px;font-size:13px;font-weight:600;color:#166534;}
.tip{background:#FFFBEB;border:1.5px solid #FCD34D;border-radius:12px;padding:11px 13px;font-size:13px;color:#92400E;line-height:1.7;}
.tip strong{display:block;margin-bottom:3px;color:#78350F;}
.jt{display:inline-block;background:#F5F3FF;border:1.5px solid #C4B5FD;border-radius:8px;padding:4px 9px;font-size:11px;color:#5B21B6;margin:2px;font-weight:600;}
.ebox{background:#F8FAFC;border-radius:10px;padding:9px 13px;font-size:13px;color:var(--mid);line-height:1.7;border:1px solid var(--border);}
.nores{text-align:center;padding:60px 20px;color:#AAA;display:none;}
footer{background:var(--dark);color:#64748B;text-align:center;padding:20px;font-size:11px;line-height:1.8;}
footer strong{color:var(--saffron);}
</style>
</head>

const cats=['બધા',...[...new Set(C.map(x=>x.cat))]];
let curCat='બધા',curSrch='';
const tabsBar=document.getElementById('tabsBar');
cats.forEach(c=>{const b=document.createElement('button');b.className='tab'+(c==='બધા'?' active':'');b.textContent=c==='બધા'?'બધા':c;b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');curCat=c;render();};tabsBar.appendChild(b);});
function render(){const list=document.getElementById('list');const nores=document.getElementById('nores');const s=curSrch.toLowerCase();const filtered=C.filter(c=>{const mc=curCat==='બધા'||c.cat===curCat;const ms=!s||c.name.toLowerCase().includes(s)||c.sub.toLowerCase().includes(s);return mc&&ms;});list.innerHTML='';nores.style.display=filtered.length?'none':'block';filtered.forEach(c=>{const card=document.createElement('div');card.className='card';const docsHtml=c.docs.map((d,i)=>`<div class="dr"><div class="dn">${i+1}</div><span>${d}</span></div>`).join('');const datesHtml=c.dates.map(d=>`<div class="dc">📅 ${d}</div>`).join('');const jobsHtml=c.jobs.map(j=>`<span class="jt">💼 ${j}</span>`).join('');card.innerHTML=`<div class="card-hd" onclick="toggle(this)"><div class="cicon" style="background:${c.bg}">${c.icon}</div><div class="ctitle"><h3>${c.name}</h3><p>${c.sub}</p></div><div class="carr">▶</div></div><div class="detail"><div class="ds"><div class="dsh" style="color:#1D4ED8">🎯 Eligibility</div><div class="ebox">${c.elig}</div></div><div class="ds"><div class="dsh" style="color:#16A34A">✏️ Entrance Exam</div><div class="ep">📝 ${c.exam}</div></div><div class="ds"><div class="dsh" style="color:#1D4ED8">📋 કયો Form ભરવો?</div><div class="fb"><div class="fn">${c.form.n}</div><div class="ff">${c.form.f}</div><div class="fw">🌐 ${c.form.w}</div></div></div><div class="ds"><div class="dsh" style="color:#DC2626">⏰ Dates</div><div>${datesHtml}</div></div><div class="ds"><div class="dsh" style="color:#F97316">📁 Documents (${c.docs.length})</div>${docsHtml}</div><div class="ds"><div class="tip"><strong>💡 ટિપ</strong>${c.tip}</div></div><div class="ds"><div class="dsh" style="color:#7C3AED">🚀 Career</div><div>${jobsHtml}</div></div></div>`;list.appendChild(card);});}
function toggle(hd){const card=hd.closest('.card');const open=card.classList.contains('open');document.querySelectorAll('.card.open').forEach(c=>c.classList.remove('open'));if(!open){card.classList.add('open');card.scrollIntoView({behavior:'smooth',block:'nearest'});}}
function filter(){curSrch=document.getElementById('srch').value;render();}
render();
</script>
